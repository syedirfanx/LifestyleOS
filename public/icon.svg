<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Subtle Background Rings / Geometry -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Lifestyle OS Stylized Brand Emblem -->
  <g filter="url(#glow)">
    <!-- Vertical Pillar -->
    <rect x="160" y="130" width="48" height="252" rx="24" fill="url(#primaryGrad)" />
    <!-- Horizontal Base -->
    <rect x="160" y="334" width="192" height="48" rx="24" fill="url(#primaryGrad)" />
    <!-- Accent Indicator Node -->
    <circle cx="352" cy="200" r="28" fill="url(#accentGrad)" />
    <circle cx="352" cy="200" r="14" fill="#ffffff" />
  </g>
</svg>
